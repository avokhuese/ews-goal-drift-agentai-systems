[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goal-drift-agent"
version = "0.1.0"
description = "Early-warning signals for goal drift in agentic AI systems"
requires-python = ">=3.8.8"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "rank_bm25>=0.2.2",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]